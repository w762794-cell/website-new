<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>រឿងចិន → Subtitle ខ្មែរ</title>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #e0b64f;
    --accent2: #c94f4f;
    --text: #f1ede4;
    --muted: #9aa0ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Khmer OS", "Noto Sans Khmer", system-ui, sans-serif;
    background: linear-gradient(160deg, #0f1115, #1a1d24);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 1.6rem;
    text-align: center;
    margin-bottom: 4px;
    color: var(--accent);
  }
  p.sub { text-align: center; color: var(--muted); margin-top: 0; margin-bottom: 28px; }
  .card {
    background: var(--card);
    border: 1px solid #2a2e38;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .drop {
    border: 2px dashed #3a3f4b;
    border-radius: 12px;
    padding: 36px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .drop.dragover { border-color: var(--accent); background: #1f2330; }
  .drop input { display: none; }
  .drop .icon { font-size: 2.2rem; margin-bottom: 8px; }
  .filename { margin-top: 10px; color: var(--accent); font-weight: 600; word-break: break-all; }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #16181d;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity .2s;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { margin-top: 14px; text-align: center; color: var(--muted); min-height: 1.4em; }
  .error { color: var(--accent2); text-align: center; margin-top: 10px; white-space: pre-wrap; }
  .segments { max-height: 380px; overflow-y: auto; margin-top: 10px; }
  .seg { padding: 10px 0; border-bottom: 1px solid #262a33; }
  .seg .time { font-size: .75rem; color: var(--muted); }
  .seg .zh { color: #b9bfca; font-size: .85rem; margin-top: 2px; }
  .seg .km { color: var(--text); font-size: 1rem; margin-top: 4px; }
  a.download {
    display: block;
    text-align: center;
    margin-top: 14px;
    background: #2e7d5b;
    color: #fff;
    padding: 14px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
  }
  .hint { font-size: .8rem; color: var(--muted); text-align: center; margin-top: -8px; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>រឿងចិន → Subtitle ខ្មែរ</h1>
  <p class="sub">Upload ឯកសារ mp3 រឿងចិន ដើម្បីបំលែងជាអក្សររត់ខ្មែរ (.srt) ត្រូវតាមវិនាទី</p>

  <div class="card">
    <div class="drop" id="drop">
      <div class="icon">🎧</div>
      <div>ចុច ឬអូសឯកសារ mp3 មកទីនេះ</div>
      <div class="filename" id="filename"></div>
      <input type="file" id="fileInput" accept=".mp3,audio/mpeg" />
    </div>
    <p class="hint">ទទួលបានរហូតដល់ ~១៥-២០ នាទី (ប្រព័ន្ធនឹងបង្រួម audio ស្វ័យប្រវត្តិមុនផ្ញើ)</p>
    <button id="submitBtn" disabled>បំលែងឥឡូវនេះ</button>
    <div class="status" id="status"></div>
    <div class="error" id="error"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <a class="download" id="downloadLink" download="subtitle-km.srt">⬇️ ទាញយកឯកសារ subtitle.srt</a>
    <div class="segments" id="segments"></div>
  </div>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const filenameEl = document.getElementById('filename');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const resultCard = document.getElementById('resultCard');
const segmentsEl = document.getElementById('segments');
const downloadLink = document.getElementById('downloadLink');

let selectedFile = null;

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  drop.classList.remove('dragover');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) setFile(fileInput.files[0]);
});

function setFile(file) {
  const isMp3 = /\.mp3$/i.test(file.name) || file.type === 'audio/mpeg' || file.type === 'audio/mp3';

  if (!isMp3) {
    errorEl.textContent = 'សូម upload តែឯកសារ .mp3 ប៉ុណ្ណោះ (ឯកសារ video ដូចជា .mp4 មិនអាចប្រើបានទេ)';
    filenameEl.textContent = '';
    submitBtn.disabled = true;
    selectedFile = null;
    return;
  }

  selectedFile = file;
  filenameEl.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
  submitBtn.disabled = false;
  errorEl.textContent = '';
  resultCard.style.display = 'none';
}

// Decode + downsample to 16kHz mono + re-encode at low bitrate, entirely in the browser,
// so long recordings still fit under Vercel's ~4.4MB upload limit.
async function compressAudioForUpload(file) {
  const arrayBuffer = await file.arrayBuffer();
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const tempCtx = new AudioCtx();
  let audioBuffer;
  try {
    audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
  } finally {
    tempCtx.close();
  }

  const TARGET_SAMPLE_RATE = 16000;
  const TARGET_BITRATE_KBPS = 24;

  const offlineCtx = new OfflineAudioContext(
    1,
    Math.ceil(audioBuffer.duration * TARGET_SAMPLE_RATE),
    TARGET_SAMPLE_RATE
  );
  const source = offlineCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(offlineCtx.destination);
  source.start(0);
  const rendered = await offlineCtx.startRendering();

  const channelData = rendered.getChannelData(0);
  const samples = new Int16Array(channelData.length);
  for (let i = 0; i < channelData.length; i++) {
    const s = Math.max(-1, Math.min(1, channelData[i]));
    samples[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }

  const mp3Encoder = new lamejs.Mp3Encoder(1, TARGET_SAMPLE_RATE, TARGET_BITRATE_KBPS);
  const blockSize = 1152;
  const mp3Chunks = [];
  for (let i = 0; i < samples.length; i += blockSize) {
    const chunk = samples.subarray(i, i + blockSize);
    const buf = mp3Encoder.encodeBuffer(chunk);
    if (buf.length > 0) mp3Chunks.push(buf);
  }
  const finalBuf = mp3Encoder.flush();
  if (finalBuf.length > 0) mp3Chunks.push(finalBuf);

  return new Blob(mp3Chunks, { type: 'audio/mp3' });
}

submitBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  submitBtn.disabled = true;
  errorEl.textContent = '';
  statusEl.textContent = 'កំពុងបង្រួម audio... (ចាំបន្តិច ជាពិសេសបើឯកសារវែង)';

  let uploadBlob;
  try {
    uploadBlob = await compressAudioForUpload(selectedFile);
  } catch (compressErr) {
    errorEl.textContent = 'កំហុសពេលបង្រួម audio: ' + compressErr.message + ' — សូមសាកល្បងឯកសារផ្សេង ឬខ្លីជាងនេះ';
    statusEl.textContent = '';
    submitBtn.disabled = false;
    return;
  }

  if (uploadBlob.size > 4.3 * 1024 * 1024) {
    errorEl.textContent = `ទោះបីជាបង្រួមរួចហើយក៏ដោយ ឯកសារនៅតែធំពេក (${(uploadBlob.size / 1024 / 1024).toFixed(2)} MB) — សូមប្រើ clip ខ្លីជាងនេះ (ក្រោម ២០ នាទីប្រហែល)`;
    statusEl.textContent = '';
    submitBtn.disabled = false;
    return;
  }

  statusEl.textContent = 'កំពុងបំលែងសំឡេងទៅជាអក្សរ និងបកប្រែជាភាសាខ្មែរ... សូមរង់ចាំ';

  const formData = new FormData();
  formData.append('audio', uploadBlob, 'audio.mp3');

  try {
    const res = await fetch('/api/process', { method: 'POST', body: formData });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'មានបញ្ហាមិនស្គាល់មូលហេតុកើតឡើង');
    }

    statusEl.textContent = 'រួចរាល់!';
    const blob = new Blob([data.srt], { type: 'text/plain;charset=utf-8' });
    downloadLink.href = URL.createObjectURL(blob);

    segmentsEl.innerHTML = '';
    data.segments.forEach((seg) => {
      const div = document.createElement('div');
      div.className = 'seg';
      div.innerHTML = `
        <div class="time">${seg.start.toFixed(1)}s – ${seg.end.toFixed(1)}s</div>
        <div class="zh">${seg.original}</div>
        <div class="km">${seg.khmer}</div>
      `;
      segmentsEl.appendChild(div);
    });

    resultCard.style.display = 'block';
  } catch (err) {
    errorEl.textContent = 'កំហុស: ' + err.message;
    statusEl.textContent = '';
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
